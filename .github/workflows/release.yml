name: Release

# Builds a static Linux x86_64 `jsc` binary and publishes it as a GitHub Release
# asset. Triggered by pushing a `v*` tag, or manually via workflow_dispatch.
#
# jsc is a learning-oriented compiler; source install (`cargo install`) is the
# primary path. This single prebuilt binary is a convenience for the common case;
# other platforms build from source.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build + publish (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain 1.96.0 (+ musl target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --profile dist --target x86_64-unknown-linux-musl --locked -p jsc

      - name: Package tarball
        run: |
          set -eu
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/dist/jsc jsc
          chmod +x jsc
          tar -czf dist/jsc-linux-x64.tar.gz jsc
          rm jsc

      - name: Resolve tag name
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "${INPUT_VERSION}" ]; then
            echo "name=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag (if dispatched)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -eu
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Create GitHub Release with the asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -eu
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            dist/jsc-linux-x64.tar.gz
