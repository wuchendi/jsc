# CI for jsc — the Rust acceptance gate.
#
# swc is consumed from crates.io (pinned versions in crates/jsc-core/Cargo.toml),
# so the workspace compiles on any runner — no local path provisioning needed.
#
# Manual only: run it from the Actions tab (or `gh workflow run ci.yml --ref <branch>`).
# Pushes and pull requests do not trigger it.

name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt + clippy + doctests + deny + shear + typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toolchain is pinned to 1.99.1 (matches rust-toolchain.toml / MSRV).
      - name: Install toolchain 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install gate tools (nextest, deny, shear, typos)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-shear,typos-cli

      # --- Gates that do not compile the workspace: always run. ---
      - name: Format check
        run: cargo fmt --all --check

      - name: Typos
        run: typos

      # --- Gates that compile the workspace. ---
      # deny-warnings is inherited from [workspace.lints], so clippy needs no -D.
      - name: Clippy
        run: cargo clippy --all-targets --workspace

      - name: Doctests
        run: cargo test --doc --workspace

      - name: Unicode tables up to date
        run: cargo run -p unicode-tables -- --check

      - name: Unused deps (cargo-shear)
        run: cargo shear

      # cargo-deny reads manifests/lockfile only — no workspace compile needed.
      - name: Supply-chain (cargo-deny)
        run: cargo deny check

  test:
    name: test (nextest ${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # One quarter of the workspace tests; every partition runs to the end.
      - name: Test (nextest)
        run: cargo nextest run --workspace --no-fail-fast --partition count:${{ matrix.part }}/4

  # design/runtime-memory.md §7.1 `gc_stress_run_suite`: the jsc-core run-test
  # suite once more with JSC_GC_STRESS=127, which makes the shared test
  # helpers compile every program with the `gc_stress` interval 127: a full
  # collection at every allocation for the first 30 000 collections of a run
  # (GC_STRESS_PREFIX; nearly every test program ends inside it and is
  # checked exactly as with JSC_GC_STRESS=1), then at every 127th allocation.
  # A collection per allocation costs O(allocations x live set): the two
  # 100 000-link promise chains of promises::long_then_chain_no_stack_growth
  # (live sets growing with every allocation) took 5832 s that way; under
  # this setting the prefix costs ~(30k / total allocations)^2 of that and
  # the tail ~1/127 (~46 s). A missed root at a site run many times is still
  # hit after the prefix; 127 is prime, so a loop body whose allocation count
  # is not a multiple of 127 cannot alias every collection onto the same
  # site. The gc_* canaries (common::assert_same_under_gc_stress) always use
  # interval 1. Collection must not change any output. Excluded:
  # - binary(opcount): fuel assertions and the opcount snapshot measure the
  #   default build (they compile without the shared helpers).
  # - binary(memory): heap-cap and out-of-memory tests that fill up to the
  #   512 MiB cap with a live set (30 000 collections each tracing up to
  #   ~0.5 GiB), plus the million-allocation growth tests.
  gc-stress:
    name: gc-stress (nextest ${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      JSC_GC_STRESS: "127"
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test under gc_stress (nextest)
        run: >-
          cargo nextest run -p jsc-core --no-fail-fast
          --partition count:${{ matrix.part }}/4
          -E 'not (binary(opcount) | binary(memory))'

  # test262 in four parallel shards (`--partition K/4`: round-robin over the
  # sorted test list); each shard checks only the baseline entries it owns.
  test262:
    name: test262 (shard ${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      # All shards restore the same release build; only shard 1 (which also
      # builds the M1 harness tests) saves it, so parallel saves never collide.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.partition == 1 }}

      # The pinned test262 SHA lives in the fetch script, so key on its hash.
      - name: Cache test262 checkout
        uses: actions/cache@v6
        with:
          path: .tmp/test262
          key: test262-${{ hashFiles('scripts/test262-fetch.sh') }}

      - name: Fetch test262
        run: bash scripts/test262-fetch.sh

      - name: Build jsc (release)
        run: cargo build --release -p jsc

      # M1: the official sta.js + assert.js compile and run unmodified. The
      # tests return early without the checkout, so require it first.
      - name: M1 harness tests
        if: matrix.partition == 1
        run: |
          test -f .tmp/test262/harness/assert.js
          cargo test --release -p jsc --test test262_harness -- --nocapture

      # Fails if any baseline test owned by this shard regressed.
      - name: Check against baseline
        run: cargo run --release -p jsc-test262 -- --check --partition ${{ matrix.partition }}/4

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-results-${{ matrix.partition }}
          path: .tmp/test262-results.tsv
          if-no-files-found: ignore

  # Merges the shard results into the single `test262-results` artifact (one
  # TSV sorted by path, as an unpartitioned run writes it), so the baseline
  # and history can be regenerated from CI. Runs even when a shard's check
  # failed; a failed shard still fails the workflow, and a missing shard
  # result fails this job.
  test262-results:
    name: test262 (merge results)
    runs-on: ubuntu-latest
    needs: test262
    if: always()
    steps:
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test262-results-*
          path: shards

      - name: Merge shard results
        run: |
          for k in 1 2 3 4; do
            test -f "shards/test262-results-$k/test262-results.tsv" || {
              echo "missing results of shard $k/4" >&2
              exit 1
            }
          done
          mkdir -p .tmp
          cat shards/test262-results-*/test262-results.tsv \
            | LC_ALL=C sort -t "$(printf '\t')" -k1,1 > .tmp/test262-results.tsv
          wc -l .tmp/test262-results.tsv

      - name: Upload test262 results
        uses: actions/upload-artifact@v4
        with:
          name: test262-results
          path: .tmp/test262-results.tsv

  # NOTE: portable musl / multi-platform release binaries are built by
  # release.yml on `v*` tags (and manual dispatch), not on every push.
