# CI for jsc — the Rust acceptance gate.
#
# swc is consumed from crates.io (pinned versions in crates/jsc-core/Cargo.toml),
# so the workspace compiles on any runner — no local path provisioning needed.
#
# This gate only checks the Rust workspace, so it runs only when Rust-relevant
# files change (paths allowlist below). Changes to the JS/TS monorepo
# (package.json, apps/**, packages/**, scripts/**) and docs do NOT trigger it,
# except scripts/test262-fetch.sh, which pins the test262 checkout.

name: CI

on:
  push:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "_typos.toml"
      - "tests/test262/**"
      - "scripts/test262-fetch.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *rust-paths

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt + clippy + test + deny + shear + typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Toolchain is pinned to 1.99.1 (matches rust-toolchain.toml / MSRV).
      - name: Install toolchain 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install gate tools (nextest, deny, shear, typos)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-shear,typos-cli

      # --- Gates that do not compile the workspace: always run. ---
      - name: Format check
        run: cargo fmt --all --check

      - name: Typos
        run: typos

      # --- Gates that compile the workspace. ---
      # deny-warnings is inherited from [workspace.lints], so clippy needs no -D.
      - name: Clippy
        run: cargo clippy --all-targets --workspace

      - name: Test (nextest)
        run: cargo nextest run --workspace

      - name: Doctests
        run: cargo test --doc --workspace

      - name: Unused deps (cargo-shear)
        run: cargo shear

      # cargo-deny reads manifests/lockfile only — no workspace compile needed.
      - name: Supply-chain (cargo-deny)
        run: cargo deny check

  test262:
    name: test262 (baseline regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The pinned test262 SHA lives in the fetch script, so key on its hash.
      - name: Cache test262 checkout
        uses: actions/cache@v4
        with:
          path: .tmp/test262
          key: test262-${{ hashFiles('scripts/test262-fetch.sh') }}

      - name: Fetch test262
        run: bash scripts/test262-fetch.sh

      - name: Build jsc (release)
        run: cargo build --release -p jsc

      # Fails if any test passing in tests/test262/baseline.txt regressed.
      - name: Check against baseline
        run: cargo run --release -p jsc-test262 -- --check

  # NOTE: portable musl / multi-platform release binaries are built by
  # release.yml on `v*` tags (and manual dispatch), not on every push.
