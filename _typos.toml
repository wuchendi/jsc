# typos configuration.
# These tokens are correct in this codebase and must not be "fixed".
[default.extend-words]
mis  = "mis"   # legit English prefix: "mis-dispatch", "mis-evaluate"
abd  = "abd"   # intentional lexical-order test data: "abc" < "abd"
hel  = "hel"   # expected string output: "hello".substring(-2,3) == "hel"
ba   = "ba"    # expected string output: "ab".repeat(2).slice(1,3) == "ba"
trys = "trys"  # plural of the `try` keyword in prose/comments
