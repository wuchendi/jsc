[package]
name         = "jsc"
description  = "Command-line ahead-of-time JavaScript/TypeScript to WebAssembly compiler"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[[bin]]
name = "jsc"
path = "src/main.rs"

[dependencies]
jsc-core = { path = "../jsc-core" }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[lints]
workspace = true
