[package]
name         = "jsc-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[features]
default = ["native-run"]
# Native execution stage: pulls in wasmtime to instantiate and run the emitted
# module. Off by the caller (e.g. wasm32 targets) leaves a frontend+codegen+emit
# core that produces module bytes without a runtime.
native-run = ["dep:wasmtime"]

[dependencies]
anyhow                         = "1.0.104"
swc_common                     = "26"
swc_ecma_ast                   = "29"
swc_ecma_parser                = "46"
swc_ecma_transforms_base       = "50"
swc_ecma_transforms_typescript = "56"
wasm-encoder                   = "0.262.0"
wasmtime                       = { version = "49.0.3", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"], optional = true }

[dev-dependencies]
wasmparser = "0.262.0"

[lints]
workspace = true
