[package]
name         = "jsc-core"
description  = "Compiler core for jsc: swc frontend, IR, wasm emitter and wasmtime runner"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[features]
default = ["native-run"]
# Native execution stage: pulls in wasmtime to instantiate and run the emitted
# module. Off by the caller (e.g. wasm32 targets) leaves a frontend+codegen+emit
# core that produces module bytes without a runtime.
# The native host also normalizes strings (`String.prototype.normalize`).
native-run = ["dep:icu_normalizer", "dep:wasmtime"]

[dependencies]
anyhow                         = "1.0.104"
icu_normalizer                 = { version = "2.4.0", optional = true }
swc_common                     = "26"
swc_ecma_ast                   = "29"
swc_ecma_parser                = "46"
swc_ecma_transforms_base       = "50"
swc_ecma_transforms_typescript = "56"
swc_ecma_visit                 = "29"
wasm-encoder                   = "0.262.0"
wasmtime                       = { version = "50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"], optional = true }

[dev-dependencies]
wasmparser = "0.262.0"

[lints]
workspace = true
